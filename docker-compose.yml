# Self-host Forge with Docker Compose or Podman Compose:
#   cp .env.example .env   # set FORGE_IMAGE_OWNER, TZ, sign-in
#   docker compose up -d   # or: podman compose up -d
# Then open http://<your-pi>:3000, or point a reverse proxy / Cloudflare
# Tunnel at http://localhost:3000.
services:
  forge:
    image: ghcr.io/${FORGE_IMAGE_OWNER:-your-github-user}/forge:${FORGE_TAG:-latest}
    container_name: forge
    restart: unless-stopped
    ports:
      # FORGE_BIND=127.0.0.1 keeps Forge off the LAN so it's only reachable
      # through a tunnel/proxy running on the same host.
      - "${FORGE_BIND:-0.0.0.0}:${FORGE_PORT:-3000}:3000"
    environment:
      # Your local time zone: "today" rolls over at your midnight.
      TZ: ${TZ:-America/Denver}
      # Public URL, e.g. your Cloudflare Tunnel hostname. Required for OIDC;
      # https enables secure cookies.
      APP_URL: ${APP_URL:-}
      # ── Sign-in (required when reachable from the internet) ──
      # OIDC: multi-tenant, every identity gets its own data.
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_PROVIDER_NAME: ${OIDC_PROVIDER_NAME:-}
      OIDC_ALLOWED_EMAILS: ${OIDC_ALLOWED_EMAILS:-}
      # Passcode: single user.
      APP_PASSWORD: ${APP_PASSWORD:-}
    volumes:
      - forge-data:/data

volumes:
  forge-data:
